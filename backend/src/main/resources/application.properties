# =========================================================================
# VIRTUAL TUNE - Backend Spring Boot Configuration
# =========================================================================

server.port=8080

# -------------------------------------------------------------------------
# DATABASE: H2 In-Memory (Zero-Install: Tu dong tao DB trong RAM, chay moi may)
# -------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:VirtualTuneDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------------
# DATABASE: Microsoft SQL Server 2022 (Neu muon ket noi SQL Server that)
# -------------------------------------------------------------------------
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=VirtualTuneDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
# spring.datasource.username=sa
# spring.datasource.password=123
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA
# ddl-auto=create: drops & recreates all tables on every startup (fresh seed data)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Java 25 Virtual Threads
spring.threads.virtual.enabled=true

# File Upload (3D models GLTF/GLB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
