# =========================================================================
# VIRTUAL TUNE - Backend Spring Boot Configuration
# =========================================================================

server.port=8080

# Cấu hình Kết nối Microsoft SQL Server 2022
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=VirtualTuneDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=YourStrongPassword123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Tối ưu tải trọng ảo (Java 25 Virtual Threads)
spring.threads.virtual.enabled=true

# Upload file model 3D (GLTF/GLB) nếu cần
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
