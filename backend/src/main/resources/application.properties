# =========================================================================
# VIRTUAL TUNE - Backend Spring Boot Configuration (Base)
# =========================================================================

# Server Port: dynamic binding via PORT (Render default), SERVER_PORT, default 10000
server.port=${PORT:${SERVER_PORT:10000}}

# Active Spring Profile: 'dev' by default, overridden by SPRING_PROFILES_ACTIVE=prod in production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# -------------------------------------------------------------------------
# DATABASE: H2 In-Memory (Zero-Install: Tu dong tao DB trong RAM, chay moi may)
# -------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:VirtualTuneDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Web Console path (enabled/disabled per profile in application-dev / application-prod)
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------------
# DATABASE: Microsoft SQL Server 2022 (Optional external connection)
# -------------------------------------------------------------------------
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=VirtualTuneDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
# spring.datasource.username=sa
# spring.datasource.password=123
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA
# ddl-auto=create: drops & recreates all tables on every startup (fresh seed data)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Java 25 Virtual Threads
spring.threads.virtual.enabled=true

# File Upload (3D models GLTF/GLB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# CORS Allowed Origin Patterns (default fallback allows local development)
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
