# =========================================================================
# VIRTUAL TUNE - Backend Spring Boot Configuration
# =========================================================================

server.port=8080

# Microsoft SQL Server 2022 Connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=VirtualTuneDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA
# ddl-auto=create: drops & recreates all tables on every startup (fresh seed data)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Java 25 Virtual Threads
spring.threads.virtual.enabled=true

# File Upload (3D models GLTF/GLB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
