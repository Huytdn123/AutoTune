# =========================================================================
# VIRTUAL TUNE - Production Profile Configuration (prod - Render Cloud)
# =========================================================================

# Disable H2 Web Console in production to protect memory & database access
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# Production CORS: Allow Vercel domains (supports preview & production *.vercel.app)
# Override via CORS_ALLOWED_ORIGINS environment variable for custom domains
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:https://*.vercel.app}

