# =========================================================================
# VIRTUAL TUNE - Development Profile Configuration (dev)
# =========================================================================

# Enable H2 Web Console for local testing and debugging
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Allow local Vite dev servers on any localhost or 127.0.0.1 port
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

