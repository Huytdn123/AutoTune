<!doctype html>
<html lang="en" class="light">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIRTUAL TUNE | Automotive Customization & Precision Fitment Platform</title>

    <!-- Google Fonts: Montserrat, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Immediate Theme Initialization to eliminate flash of unstyled theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vt_theme') || localStorage.getItem('theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          var doc = document.documentElement;
          if (theme === 'dark') {
            doc.classList.add('dark');
            doc.classList.remove('light');
            doc.setAttribute('data-theme', 'dark');
            doc.style.colorScheme = 'dark';
          } else {
            doc.classList.add('light');
            doc.classList.remove('dark');
            doc.setAttribute('data-theme', 'light');
            doc.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
